<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PERON TIPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>PERON TIPS</h1>

    <label for="section">Select Section:</label>
    <select id="section">
      <option value="A">Section A</option>
      <option value="B">Section B</option>
      <option value="C">Section C</option>
      <option value="D">Section D</option>
      <option value="E">Section E</option>
      <option value="F">Section F</option>
      <option value="G">Section G</option>
      <option value="H">Section H</option>
      <option value="I">Section I</option>
      <option value="J">Section J</option>
    </select>

    <input type="text" id="phone" placeholder="Enter Phone Number (+254...)">
    <button id="startBtn">Start Quiz (Pay First)</button>

    <div id="quizContainer" style="display: none;"></div>
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
